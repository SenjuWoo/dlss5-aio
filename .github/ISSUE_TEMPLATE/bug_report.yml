name: Bug report
description: Something is broken or does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README's troubleshooting section and search existing issues first.

        For a security problem, do not open an issue — use the private advisory
        link in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit you are running.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, game build, runtime or toolchain version — whichever applies here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant lines. The README names where the log lives.
      render: text
    validations:
      required: false
